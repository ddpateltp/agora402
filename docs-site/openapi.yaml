components:
  parameters:
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      schema: { type: string }
      description: >-
        x402 payment payload (base64 JSON) built from the PAYMENT-REQUIRED challenge of
        the 402 answer. Omit on the first call to receive the price. BuyerAgent and
        @x402/fetch set this for you. The legacy name X-PAYMENT is also accepted.
  headers:
    PaymentResponse:
      schema: { type: string }
      description: >-
        x402 settlement result (base64 JSON) including the Hedera transaction id, e.g.
        0.0.4009876@1789560131.552341000. Look it up on HashScan or through the mirror node.
  responses:
    PaymentRequired:
      description: >-
        No valid payment attached. The PAYMENT-REQUIRED header carries the x402 challenge
        (scheme exact, network, asset, amount, payTo, facilitator). Build the payment,
        retry with PAYMENT-SIGNATURE.
      headers:
        PAYMENT-REQUIRED:
          schema: { type: string }
          description: base64 JSON x402 challenge with the accepted payment options for this exact request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequiredBody'
          example:
            error: payment required
            endpoint: infer
            hint: 'POST /a2a/quote with {"endpointId":"infer"} to negotiate, then retry with the quoteId'
            quoteId: null
  schemas:
    HederaEntityId:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      description: Hedera entity id, shard.realm.num
      example: '0.0.5001234'
    Amount:
      type: string
      pattern: '^\d+$'
      description: Atomic units of the asset as a decimal string (tinybars for HBAR). Never a float.
      example: '60000'
    Uaid:
      type: string
      pattern: '^uaid:'
      description: HCS-14 universal agent id
      example: 'uaid:aid:2NEpo7TZRRrLZSi2U;uid=agora-demo-seller;registry=agora402;proto=a2a;nativeId=hedera:testnet:0.0.5001234;domain=localhost:4402'
    Network:
      type: string
      enum: [hedera:testnet, hedera:mainnet]
      description: CAIP-2 network id
    PricingModel:
      description: How an endpoint is priced. Amounts are atomic units of the payment option's asset.
      oneOf:
        - title: flat
          type: object
          required: [kind, amount]
          properties:
            kind: { type: string, enum: [flat], description: Fixed price per request }
            amount: { $ref: '#/components/schemas/Amount' }
        - title: per-token
          type: object
          required: [kind, base, inputPer1k, outputPer1k]
          properties:
            kind: { type: string, enum: [per-token], description: Base fee plus input and budgeted output tokens }
            base: { $ref: '#/components/schemas/Amount', description: Charged once per request }
            inputPer1k: { $ref: '#/components/schemas/Amount', description: 'Per 1,000 input tokens, rounded up' }
            outputPer1k: { $ref: '#/components/schemas/Amount', description: 'Per 1,000 output tokens, budgeted from max_tokens, rounded up' }
        - title: per-unit
          type: object
          required: [kind, unit, amountPerUnit]
          properties:
            kind: { type: string, enum: [per-unit], description: 'Price times units, at least one unit' }
            unit: { type: string, description: 'Unit label, e.g. query, second, kb' }
            amountPerUnit: { $ref: '#/components/schemas/Amount' }
      discriminator:
        propertyName: kind
    PaymentOptionSpec:
      type: object
      description: One way to pay for an endpoint
      required: [network, asset, symbol, decimals, pricing]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        asset: { $ref: '#/components/schemas/HederaEntityId', description: '0.0.0 is native HBAR, otherwise an HTS token id' }
        symbol: { type: string, description: 'Human label, e.g. HBAR or TOLL' }
        decimals: { type: integer, minimum: 0, maximum: 18, description: 8 for HBAR }
        pricing: { $ref: '#/components/schemas/PricingModel' }
    EndpointSpec:
      type: object
      description: One sellable endpoint
      required: [id, method, path, description, accepts]
      properties:
        id: { type: string, description: 'Stable id inside the service, used as endpointId in quotes, e.g. infer' }
        method: { type: string, enum: [GET, POST] }
        path: { type: string, description: 'Path relative to baseUrl, starts with /' }
        description: { type: string }
        skills:
          type: array
          items: { type: integer, minimum: 0 }
          description: 'HCS-14 / OASF skill codes: 0 text generation, 20 data retrieval, 40 assessment'
        accepts:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PaymentOptionSpec' }
    ServiceListing:
      type: object
      description: What a seller publishes to the registry topic and serves as its manifest
      required: [uaid, name, version, payTo, baseUrl, facilitator, endpoints, publishedAt]
      properties:
        uaid: { $ref: '#/components/schemas/Uaid' }
        name: { type: string }
        version: { type: string }
        payTo: { $ref: '#/components/schemas/HederaEntityId', description: Account that receives payments }
        baseUrl: { type: string, format: uri }
        quotePath: { type: string, default: /a2a/quote, description: 'A2A-style quote endpoint, relative to baseUrl' }
        facilitator: { type: string, format: uri, description: Blocky402 facilitator that verifies and settles }
        endpoints:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EndpointSpec' }
        receiptsTopicId: { $ref: '#/components/schemas/HederaEntityId', description: HCS topic where the seller writes receipts; absent when receipts stay in memory }
        publishedAt: { type: string, format: date-time }
    AgentCard:
      type: object
      description: A2A agent card with the x402 extension
      required: [name, description, url, version, provider, uaid, capabilities, skills]
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        version: { type: string }
        provider:
          type: object
          properties:
            organization: { type: string }
            url: { type: string, format: uri }
        uaid: { $ref: '#/components/schemas/Uaid' }
        capabilities:
          type: object
          properties:
            streaming: { type: boolean, description: Always false }
            pushNotifications: { type: boolean, description: Always false }
            extensions:
              type: array
              items:
                type: object
                properties:
                  uri: { type: string, format: uri }
                  description: { type: string }
                  required: { type: boolean }
                  params:
                    type: object
                    description: For the x402 extension payment_network, facilitator and assets
                    additionalProperties: true
        skills:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              tags: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status, uaid, network, facilitator, llm, receiptsToHcs, role, auditsToHcs]
      properties:
        status: { type: string, enum: [ok] }
        uaid: { $ref: '#/components/schemas/Uaid' }
        network: { $ref: '#/components/schemas/Network' }
        facilitator: { type: string, format: uri }
        llm: { type: string, description: 'LLM provider name: groq, anthropic or mock' }
        receiptsToHcs: { type: boolean, description: true when receipts are published to the receipts topic }
        role: { type: string, enum: [services, auditor, both], description: Which endpoints this process sells }
        auditsToHcs: { type: boolean, description: true when audits are recorded on the audit topic }
    QuoteRequest:
      type: object
      required: [endpointId]
      properties:
        endpointId: { type: string, description: 'id of the endpoint in the manifest, e.g. infer or hbar-rate' }
        estimate:
          type: object
          description: The work to price. Which fields matter depends on the pricing model kind.
          properties:
            inputTokens: { type: integer, minimum: 0, description: 'per-token models, about 4 characters per token' }
            maxOutputTokens: { type: integer, minimum: 0, description: 'per-token models, the max_tokens you will send' }
            units: { type: integer, minimum: 0, description: 'per-unit models, defaults to 1' }
        maxAmount:
          type: string
          pattern: '^\d+$'
          description: Your ceiling in atomic units. At or above list you pay list; between floor and list the seller accepts your counter; below floor you get 409.
        asset:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          default: '0.0.0'
          description: Asset to pay in. 0.0.0 is HBAR.
        buyer: { type: string, description: 'Your uaid, informational, echoed in basis.buyer' }
    Quote:
      type: object
      description: A priced, time-limited offer signed by the seller account key
      required: [quoteId, seller, endpointId, network, asset, amount, expiresAt, basis, signature, signerPublicKey]
      properties:
        quoteId: { type: string, minLength: 8, description: q_ followed by 24 hex. Send it with the paid request. }
        seller: { $ref: '#/components/schemas/Uaid' }
        endpointId: { type: string }
        network: { $ref: '#/components/schemas/Network' }
        asset: { $ref: '#/components/schemas/HederaEntityId' }
        amount: { $ref: '#/components/schemas/Amount', description: Exactly what the 402 will ask for when the quote is used }
        expiresAt: { type: integer, description: Unix seconds. About 120 seconds after issue. }
        basis:
          type: object
          additionalProperties: true
          description: What the price covers, for auditability. The seller includes pricing, estimate, listPrice, countered and buyer.
        signature: { type: string, description: 'Hex ECDSA or ED25519 signature over the canonical quote body (sorted keys, everything but signature and signerPublicKey)' }
        signerPublicKey: { type: string, description: Hex DER public key of the seller account. Verify it matches the account in payTo. }
    QuoteResponse:
      type: object
      required: [quote, countered]
      properties:
        quote: { $ref: '#/components/schemas/Quote' }
        countered: { type: boolean, description: true when the seller accepted your maxAmount below list price }
    QuoteRejection:
      type: object
      required: [error]
      properties:
        error: { type: string }
        issues:
          type: array
          description: Zod validation issues, only on invalid bodies
          items:
            type: object
            additionalProperties: true
        minimumAmount: { type: string, pattern: '^\d+$', description: The least the seller will take (409 only) }
        listPrice: { type: string, pattern: '^\d+$', description: Undiscounted price (409 only) }
    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string }
        max_tokens: { type: integer, default: 256, description: 'Output budget. Priced up front per 1k, so lower is cheaper.' }
        temperature: { type: number, description: Passed to the model when present }
        quoteId: { type: string, description: Quote to pin the price to. Consumed by settlement. }
    ChatCompletion:
      type: object
      description: OpenAI-compatible chat.completion with an agora block
      required: [id, object, model, choices, usage, agora]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        model: { type: string, description: Model id reported by the upstream provider }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string, enum: [assistant] }
                  content: { type: string }
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
        agora:
          type: object
          properties:
            seller: { $ref: '#/components/schemas/Uaid' }
            quoteId: { type: [string, 'null'], description: 'The quote consumed, or null at list price' }
    RateResponse:
      type: object
      required: [pair, usdPerHbar, centsPerHbar, source, expirationTime, fetchedAt, agora]
      properties:
        pair: { type: string, enum: [HBAR/USD] }
        usdPerHbar: { type: number, description: centsPerHbar / 100 }
        centsPerHbar: { type: number, description: cent_equivalent / hbar_equivalent from the network exchange rate file }
        source: { type: string }
        expirationTime: { type: integer, description: Unix seconds at which the network rate expires }
        fetchedAt: { type: string, format: date-time }
        agora:
          type: object
          properties:
            seller: { $ref: '#/components/schemas/Uaid' }
    PaymentRequiredBody:
      type: object
      required: [error, endpoint, hint, quoteId]
      properties:
        error: { type: string, enum: [payment required] }
        endpoint: { type: string, description: endpointId of the resource }
        hint: { type: string }
        quoteId: { type: [string, 'null'], description: 'The quoteId you sent, if any' }
    Receipt:
      type: object
      description: Written to the receipts topic after every settled payment
      required: [v, type, seller, transactionId, network, payer, payTo, asset, amount, resource, usage, issuedAt]
      properties:
        v: { type: integer, enum: [1] }
        type: { type: string, enum: [receipt] }
        seller: { $ref: '#/components/schemas/Uaid' }
        transactionId: { type: string, description: 'Hedera transaction id of the settlement, 0.0.x@seconds.nanos' }
        network: { $ref: '#/components/schemas/Network' }
        payer: { $ref: '#/components/schemas/HederaEntityId', description: Buyer account debited }
        payTo: { $ref: '#/components/schemas/HederaEntityId', description: Seller account credited }
        asset: { $ref: '#/components/schemas/HederaEntityId' }
        amount: { $ref: '#/components/schemas/Amount' }
        resource: { type: string, description: Path that was paid for }
        quoteId: { type: string }
        usage:
          type: object
          additionalProperties: true
          description: Metering evidence copied from the x-agora-usage response header
        responseHash: { type: string, description: sha256 hex of the response body delivered }
        issuedAt: { type: string, format: date-time }
    StoredReceipt:
      type: object
      required: [receipt, hashscanTxUrl]
      properties:
        receipt: { $ref: '#/components/schemas/Receipt' }
        hashscanTxUrl: { type: string, format: uri }
        hcs:
          description: HCS publication result, filled in asynchronously; absent while pending or when receipts stay in memory
          oneOf:
            - type: object
              title: published
              required: [transactionId, sequenceNumber, topicUrl]
              properties:
                transactionId: { type: string }
                sequenceNumber: { type: integer }
                topicUrl: { type: string, format: uri }
            - type: object
              title: failed
              required: [error]
              properties:
                error: { type: string }
    ReceiptsResponse:
      type: object
      required: [receipts]
      properties:
        receipts:
          type: array
          items: { $ref: '#/components/schemas/StoredReceipt' }
    AuditRequest:
      type: object
      description: Name the subject by uaid (needs a registry on the auditor) or by URL
      properties:
        subject: { type: string, description: 'uaid or listing name of the seller to audit, resolved through the registry' }
        sellerUrl: { type: string, format: uri, description: Base URL of the seller; its manifest is fetched directly }
        auditId: { type: string, pattern: '^a_[0-9a-f]{16}$', description: Fresh id you generate so you can stream progress while the request is open }
        quoteId: { type: string, description: Quote to pin the price to }
    Severity:
      type: string
      enum: [none, low, medium, high, critical]
    AuditFinding:
      type: object
      required: [severity, title]
      properties:
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        detail: { type: string }
    AuditStage:
      type: object
      description: One completed stage, as written to the audit topic
      required: [v, type, auditId, subject, contentHash, auditor, auditorAccount, stage, index, total, summary, findings, model, completedAt]
      properties:
        v: { type: integer, enum: [1] }
        type: { type: string, enum: [audit_stage] }
        auditId: { type: string }
        subject: { $ref: '#/components/schemas/Uaid' }
        contentHash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'sha256 of the audited listing content (payTo, baseUrl, quotePath, facilitator, endpoints)' }
        auditor: { $ref: '#/components/schemas/Uaid' }
        auditorAccount: { $ref: '#/components/schemas/HederaEntityId' }
        stage: { type: string }
        index: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 1 }
        summary: { type: string }
        findings:
          type: array
          items: { $ref: '#/components/schemas/AuditFinding' }
        model: { type: string, description: 'LLM that produced the stage, or deterministic' }
        completedAt: { type: string, format: date-time }
        evidence:
          type: object
          additionalProperties: true
          description: Raw observations behind the stage (response only, not written to HCS)
    Attestation:
      type: object
      description: The verdict, written last to the audit topic by the auditor account
      required: [v, type, auditId, subject, contentHash, auditor, auditorAccount, verdict, trustScore, risk, summary, capabilities, findings, model, issuedAt]
      properties:
        v: { type: integer, enum: [1] }
        type: { type: string, enum: [attestation] }
        auditId: { type: string }
        subject: { $ref: '#/components/schemas/Uaid' }
        contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        auditor: { $ref: '#/components/schemas/Uaid' }
        auditorAccount: { $ref: '#/components/schemas/HederaEntityId', description: Must equal the HCS payer of the message for a buyer to accept it }
        verdict: { type: string, enum: [safe, dangerous], description: dangerous when any finding is high or critical }
        trustScore: { type: integer, minimum: 0, maximum: 100, description: '100 minus penalties: low 4, medium 12, high 30, critical 60. Buyers default to a minimum of 70.' }
        risk: { $ref: '#/components/schemas/Severity', description: Highest severity across stages }
        summary: { type: string }
        capabilities: { type: array, items: { type: string } }
        findings:
          type: array
          items: { $ref: '#/components/schemas/AuditFinding' }
        model: { type: string }
        issuedAt: { type: string, format: date-time }
    AuditResponse:
      type: object
      required: [auditId, subject, attestation, stages, topicId, topicUrl, records, recorded]
      properties:
        auditId: { type: string }
        subject:
          type: object
          properties:
            uaid: { $ref: '#/components/schemas/Uaid' }
            name: { type: string }
            payTo: { $ref: '#/components/schemas/HederaEntityId' }
        attestation: { $ref: '#/components/schemas/Attestation' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/AuditStage' }
        topicId: { type: [string, 'null'], description: 'Audit topic, null on a dry run' }
        topicUrl: { type: [string, 'null'], format: uri }
        records:
          type: array
          description: HCS publication results for audit_started, each stage and the attestation; empty on a dry run
          items:
            type: object
            additionalProperties: true
        recorded: { type: boolean, description: true when the trail was written to HCS }
    AuditEvent:
      description: One line of the audit progress stream
      oneOf:
        - title: started
          type: object
          required: [type, message]
          properties:
            type: { type: string, enum: [started] }
            message: { type: object, additionalProperties: true, description: The audit_started message }
        - title: stage running
          type: object
          required: [type, stage, index, total, status]
          properties:
            type: { type: string, enum: [stage] }
            stage: { type: string }
            index: { type: integer }
            total: { type: integer }
            status: { type: string, enum: [running] }
        - title: stage done
          type: object
          required: [type, stage, index, total, status, message, evidence]
          properties:
            type: { type: string, enum: [stage] }
            stage: { type: string }
            index: { type: integer }
            total: { type: integer }
            status: { type: string, enum: [done] }
            message: { $ref: '#/components/schemas/AuditStage' }
            evidence: { type: object, additionalProperties: true }
        - title: attestation
          type: object
          required: [type, message]
          properties:
            type: { type: string, enum: [attestation] }
            message: { $ref: '#/components/schemas/Attestation' }
        - title: recorded
          type: object
          required: [type, what, transactionId, sequenceNumber]
          properties:
            type: { type: string, enum: [recorded] }
            what: { type: string, enum: [audit_started, audit_stage, attestation] }
            stage: { type: string }
            transactionId: { type: string }
            sequenceNumber: { type: integer }
        - title: record failed
          type: object
          required: [type, what, error]
          properties:
            type: { type: string, enum: [record_failed] }
            what: { type: string, enum: [audit_started, audit_stage, attestation] }
            stage: { type: string }
            error: { type: string }
        - title: end
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [end] }
            reason: { type: string, description: unknown audit when no run appeared within 60 seconds }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable reason }
        detail: { type: string }
